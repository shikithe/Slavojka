<!doctype html>
<html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172235"><title>KVOTER | Dnevna ponuda - ListaSix</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#101722;color:#eaf1f8;font:15px system-ui,-apple-system,sans-serif}
header{position:relative;background:#172235;padding:15px 16px;border-bottom:1px solid #334154;z-index:1}
h1{font-size:19px;margin:0 0 6px}small{color:#b4c4d6}.status{padding:12px 16px;color:#b4c4d6}
.scroll{overflow-x:auto;padding:0 8px 30px}table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
/* Keep column labels in normal table flow: iOS Safari previously overlaid row 02. */
th{background:#243249;position:static;text-align:left;color:#b9d2ef;font-size:12px}
td,th{padding:11px 8px;border-bottom:1px solid #2c3a4c;white-space:nowrap}
td:nth-child(n+4),th:nth-child(n+4){text-align:right}td:nth-child(n+4){color:#a6e4b3;font-weight:600}
tr:nth-child(even){background:#172131}a{color:#9dc8ff}button{background:#2d5c91;color:white;border:0;border-radius:8px;padding:9px 13px;font-weight:600}
</style></head><body>
<header><h1>KVOTER · Dnevna kladioničarska ponuda</h1><small>1 · X · 2 · 3+ · GG / NG | Sve ESPN utakmice; kvote samo kada su potvrđene</small><div style="margin-top:10px"><button onclick="load()">Osvježi</button> &nbsp; <a href="./kvoter-ponuda.txt">TXT lista</a></div></header>
<div id="status" class="status">Učitavanje ponude…</div><div class="scroll"><table><thead><tr><th>Br.</th><th>Datum / sat</th><th>Utakmica</th><th>1</th><th>X</th><th>2</th><th>3+</th><th>GG</th><th>NG</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const status=document.getElementById('status'),body=document.getElementById('rows');
function val(v){return v===null||v===undefined||v===''?'-':String(v)}
function localTime(v){if(!v)return '-';const d=new Date(v);if(isNaN(d))return v;return new Intl.DateTimeFormat('bs-BA',{timeZone:'Europe/Sarajevo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
async function jsonMaybe(path){
 try{const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null}
 catch(e){return null}
}
function sarajevoDay(){
 const d=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Sarajevo',
 year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
 const p=Object.fromEntries(d.map(x=>[x.type,x.value]));
 return {date:p.year+'-'+p.month+'-'+p.day,mins:Number(p.hour)*60+Number(p.minute)};
}
async function load(){
 status.textContent='Učitavanje…';body.replaceChildren();
 const [feed, active, coverage]=await Promise.all([
   jsonMaybe('./collector-feed.json'),jsonMaybe('./active-list.json'),jsonMaybe('./kvoter-coverage.json')
 ]);
 const today=sarajevoDay();
 const feedValid=feed&&Array.isArray(feed.football_candidates)&&feed.date===today.date
   && (!feed.expires_at_utc||Date.now()<Date.parse(feed.expires_at_utc));
 const activeValid=active&&active.date===today.date&&active.publication_allowed
   && Array.isArray(active.fixtures)&&(!active.expires_at||Date.now()<Date.parse(active.expires_at));
 const odds=new Map(activeValid?active.fixtures.map(f=>[f.fixture_id,f]):[]);
 const statusMap=new Map(coverage&&coverage.date===today.date&&Array.isArray(coverage.fixtures)
   ?coverage.fixtures.map(f=>[f.fixture_id,f.status]):[]);
 const fixtures=feedValid?feed.football_candidates.map(f=>({
   fixture_id:f.fixture_id,datetime:f.start_utc,match:f.home+' - '+f.away
 })):activeValid?active.fixtures:[];
 if(!fixtures.length){
   status.textContent='Još nema današnjeg ESPN kolektora. Posljednja objava nije prikazana kao današnja.';
   return;
 }
 const fields=['home_odds','draw_odds','away_odds','over25_odds','btts_yes_odds','btts_no_odds'];
 let withOdds=0;
 fixtures.sort((a,b)=>String(a.datetime).localeCompare(String(b.datetime)));
 fixtures.forEach((f,i)=>{
   const v=odds.get(f.fixture_id)||{};
   const confirmed=fields.some(k=>typeof v[k]==='number'&&v[k]>1);
   if(confirmed)withOdds++;
   const tr=document.createElement('tr');
   if(!confirmed)tr.style.opacity='.78';
   const values=[String(i+1).padStart(2,'0'),localTime(f.datetime),val(f.match),
     ...fields.map(field=>val(v[field]))];
   values.forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.append(td)});
   tr.title=confirmed?'Provjerene kvote':'Nema potvrđenih kvota; utakmica ostaje vidljiva';
   body.append(tr);
 });
 status.textContent=fixtures.length+' ESPN utakmica · '+withOdds+' s potvrđenim kvotama · '
   +(fixtures.length-withOdds)+' bez kvota · '+today.date+
   ' · Crtica znači da kvota nije provjerena, ne da utakmica ne postoji.';
}

load();setInterval(load,30000);
</script></body></html>
