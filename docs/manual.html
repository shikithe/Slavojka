<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ListaSix Kvoter Manual</title><style>body{font:16px system-ui;background:#101a2b;color:#f2f6ff;margin:0;padding:22px}main{max-width:900px;margin:auto}article{background:#1d2c43;border-radius:14px;padding:18px;margin:15px 0}button,a.action{border:0;border-radius:8px;padding:10px 14px;margin:5px;background:#426ba4;color:white;cursor:pointer;text-decoration:none;display:inline-block}.selected{background:#2d936b}small{color:#b9c9dd}.warn{color:#ffcf83}</style></head><body><main><h1>Kvoter Manual</h1><p>Provjera sličnih utakmica. Odaberi Matched ili Unmatched, zatim potvrdi na GitHubu. Nijedna odluka se ne primjenjuje bez GitHub potvrde.</p><p id="status">Učitavanje…</p><div id="items"></div></main><script>
const repo='shikithe/Slavojka', box=document.getElementById('items'), status=document.getElementById('status');
const selectionByFixture=new Map();
function clearSelection(key){const prev=selectionByFixture.get(key);if(!prev)return;prev.button.classList.remove('selected');prev.button.setAttribute('aria-pressed','false');prev.link.hidden=true;prev.link.removeAttribute('href');selectionByFixture.delete(key);}
async function load(){try{let r=await fetch('./manual-candidates.json?t='+Date.now(),{cache:'no-store'});if(!r.ok){r=await fetch('https://raw.githubusercontent.com/shikithe/Slavojka/main/docs/manual-candidates.json?t='+Date.now(),{cache:'no-store'});}if(!r.ok)throw Error('Lista nije dostupna ni na GitHub Pages ni u repozitorijumu');const d=await r.json();box.replaceChildren();selectionByFixture.clear();status.textContent='Neupareni mečevi s ponuđenim OddsAPI kandidatima: '+d.total+' · Izvor: ListaSix / shared/kvoter/unmatched_fixtures.json';for(const f of d.fixtures||[]){const a=document.createElement('article');const h=document.createElement('h3');h.textContent=(f.home||'')+' – '+(f.away||'')+' ('+(f.league||'')+')';a.append(h);if(!f.candidates?.length){const p=document.createElement('p');p.textContent='Nema sličnih OddsAPI parova';a.append(p)}for(const c of f.candidates||[]){const wrap=document.createElement('div'),label=document.createElement('p');label.textContent=(c.home||'')+' – '+(c.away||'')+' | sličnost '+Math.round(c.similarity*100)+'%';wrap.append(label);for(const choice of ['matched','rejected']){const b=document.createElement('button');b.textContent=choice==='matched'?'Matched':'Unmatched';b.setAttribute('aria-pressed','false');b.onclick=()=>{
 const previous=selectionByFixture.get(f.fixture_id);
 const wasSelected=previous?.button===b;
 clearSelection(f.fixture_id);
 if(wasSelected)return;
 if(choice==='matched'){
   for(const [key,other] of selectionByFixture){
     if(other.eventId===c.event_id && other.decision==='matched')clearSelection(key);
   }
 }
 b.classList.add('selected');b.setAttribute('aria-pressed','true');
 selectionByFixture.set(f.fixture_id,{button:b,link,eventId:c.event_id,decision:choice});
 const payload={fixture_id:f.fixture_id,event_id:c.event_id,league:f.league,collector_home:f.home,collector_away:f.away,odds_home:c.home,odds_away:c.away,decision:choice};
 const title='Kvoter Manual: '+choice+' '+f.fixture_id;
 const newline=String.fromCharCode(10), fence=String.fromCharCode(96).repeat(3);
 const body=['KVOTER_MANUAL_DECISION_V1',fence+'json',JSON.stringify(payload,null,2),fence,'Potvrdi kreiranjem ovog GitHub issue-a. Odluka se provjerava prije upisa.'].join(newline);
 link.href='https://github.com/'+repo+'/issues/new?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);link.hidden=false;
};wrap.append(b)}const link=document.createElement('a');link.className='action';link.textContent='Potvrdi preko GitHuba';link.hidden=true;link.target='_blank';link.rel='noopener noreferrer';wrap.append(link);a.append(wrap)}box.append(a)}}catch(e){status.textContent=e.message+' — čekamo kandidatsku listu';}}load();
</script></body></html>
