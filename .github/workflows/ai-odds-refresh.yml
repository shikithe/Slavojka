name: Legacy AI Kvoter matching (manual only; replaced by direct daily offer)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: listasix-daily-and-expiry
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate today ESPN feed before any quote merge
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          feed=json.loads(Path('shared/collector-feed.json').read_text(encoding='utf-8'))
          today=datetime.now(ZoneInfo('Europe/Sarajevo')).date().isoformat()
          assert feed.get('date')==today and feed.get('football_candidates'), 'No fresh ESPN feed'
          exp=datetime.fromisoformat(feed['expires_at_utc'].replace('Z','+00:00'))
          assert exp>datetime.now(timezone.utc), 'ESPN feed expired'
          print('ESPN_READY_FOR_INCREMENTAL_ODDS',len(feed['football_candidates']))
          PY
      - name: Merge AI verified markets with existing quotes and refresh mobile list
        run: |
          python3 -m kvoter.merge_ai
          python3 -m lista.publish --feed shared/collector-feed.json --matches shared/kvoter/matched_fixtures.json --shared shared --docs docs
          cp shared/kvoter/coverage.json docs/kvoter-coverage.json
      - name: Commit displayed partial offer and matched bookmaker records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- docs/active-list.json docs/kvoter-ponuda.txt docs/kvoter-coverage.json shared/active-list.json shared/kvoter-ponuda.txt shared/kvoter/provider-offers.json shared/kvoter/matched_fixtures.json shared/kvoter/unmatched_fixtures.json shared/kvoter/match-report.json shared/kvoter/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "ListaSix: immediately display incremental AI odds [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Relay updated ready list to MemaraSix
        env:
          MEMARASIX_DISPATCH_TOKEN: ${{ secrets.MEMARASIX_DISPATCH_TOKEN }}
        run: |
          git pull --ff-only origin main
          python3 -m lista.notify_memarasix
