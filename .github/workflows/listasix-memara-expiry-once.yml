name: ListaSix test MemaraSix 08:55 expiry signal once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listasix-memara-expiry-once.yml'
permissions:
  contents: read
jobs:
  test-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send expiry signal by production relay (only after 08:55 Sarajevo)
        env:
          MEMARASIX_DISPATCH_TOKEN: ${{ secrets.MEMARASIX_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m lista.notify_memarasix_expiry
