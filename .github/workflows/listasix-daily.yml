name: ListaSix daily pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7,8 * * *'
permissions:
  contents: read
jobs:
  lista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Sarajevo schedule
        id: localtime
        run: echo "run=$([ \"$(TZ=Europe/Sarajevo date +%H)\" = \"09\" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Run safe setup check
        if: github.event_name == 'workflow_dispatch' || steps.localtime.outputs.run == 'true'
        run: python3 -m lista.pipeline
      - name: Upload setup report
        uses: actions/upload-artifact@v4
        with:
          name: listasix-status
          path: data/status.json
