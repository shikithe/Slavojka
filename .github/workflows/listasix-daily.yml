name: ListaSix ESPN football collector only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shared/kvoter/ai-verified-*.json'
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: listasix-espn-collector
  cancel-in-progress: false
jobs:
  collect-espn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Only collect after 09:00 Sarajevo and when today's feed is missing
        id: gate
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo
          local = datetime.now(ZoneInfo("Europe/Sarajevo"))
          path = Path("shared/collector-feed.json")
          today = local.date().isoformat()
          current = False
          if path.exists():
              try:
                  feed = json.loads(path.read_text(encoding="utf-8"))
                  current = feed.get("date") == today and bool(feed.get("football_candidates"))
              except (ValueError, OSError, TypeError):
                  pass
          run = (os.environ["TRIGGER"] == "workflow_dispatch" or local.time() >= time(9)) and not current
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={'true' if run else 'false'}\n")
          print("ESPN_COLLECTOR_GATE", local.isoformat(), "current=", current, "run=", run)
          PY
      - name: Download ESPN fixtures (football only)
        if: steps.gate.outputs.run == 'true'
        env:
          LISTASIX_SHARED: shared
        run: python3 -m lista.pipeline
      - name: Validate and commit only ESPN feed
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          feed=json.loads(Path("shared/collector-feed.json").read_text(encoding="utf-8"))
          raw=json.loads(Path("shared/collector-raw.json").read_text(encoding="utf-8"))
          assert feed["date"] == raw["date"]
          assert feed["football_candidates"], "ESPN list is empty"
          assert feed["publication_allowed"] is False, "Raw ESPN list is not betting approval"
          print("ESPN_FEED_READY", feed["date"], len(feed["football_candidates"]))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp shared/collector-feed.json docs/collector-feed.json
          git add -f -- shared/collector-feed.json shared/collector-raw.json docs/collector-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "ListaSix: publish ESPN fixture feed only [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Feedback - trigger TipsterArea only after confirmed ESPN commit
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          feed = json.loads(Path("shared/collector-feed.json").read_text(encoding="utf-8"))
          today = datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          if feed.get("date") != today or not feed.get("football_candidates"):
              raise SystemExit("ESPN_FEEDBACK_BLOCKED: missing same-day nonempty feed")
          expires = feed.get("expires_at_utc")
          if expires and datetime.fromisoformat(expires.replace("Z", "+00:00")) <= datetime.now(timezone.utc):
              raise SystemExit("ESPN_FEEDBACK_BLOCKED: ESPN feed expired")
          payload = json.dumps({"event_type": "espn-feed-ready",
                                "client_payload": {"date": today, "fixtures": len(feed["football_candidates"])}}).encode()
          url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/dispatches"
          req = urllib.request.Request(url, data=payload, method="POST", headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status != 204:
                  raise RuntimeError(f"dispatch status {response.status}")
          print("ESPN_FEEDBACK_DISPATCHED", today, len(feed["football_candidates"]))
          PY
