name: ListaSix daily Collector Agent Kvoter
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10,11 * * *'
permissions:
  contents: write
concurrency:
  group: listasix-daily
  cancel-in-progress: false
jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check 12:00 Sarajevo schedule
        id: clock
        shell: bash
        run: |
          if [ "$(TZ=Europe/Sarajevo date +%H)" = "12" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect ESPN fixtures into shared feed
        if: steps.clock.outputs.run == 'true'
        env:
          LISTASIX_SHARED: shared
        run: python3 -m lista.pipeline
      - name: Validate and persist active daily database
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          raw=json.loads(Path('shared/collector-raw.json').read_text())
          feed=json.loads(Path('shared/collector-feed.json').read_text())
          assert feed['football_candidates'], 'Empty active feed'
          assert raw['date']==feed['date']
          assert datetime.fromisoformat(feed['expires_at_utc']) > datetime.now(timezone.utc)
          assert all(raw['window_start_utc'] <= f['start_utc'].replace('Z','+00:00') < raw['window_end_utc'] for f in feed['football_candidates'])
          print('ACTIVE_FEED_VALIDATED',len(feed['football_candidates']))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- shared/collector-raw.json shared/collector-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "lista: update active ESPN feed [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build Agent history from Collector feed
        if: steps.clock.outputs.run == 'true'
        run: |
          mkdir -p shared/agent
          python3 -m agent.five_matches --input shared/collector-feed.json --output shared/agent/history-h2h.json --days 120
      - name: Run Kvoter with protected OddsAPI secret
        if: steps.clock.outputs.run == 'true'
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          KVOTER_PROVIDER_NAMES_PATH: shared/kvoter/team-database/provider-team-names.json
        run: |
          test -n "$THE_ODDS_API_KEY" || { echo "::error::THE_ODDS_API_KEY repository secret missing"; exit 1; }
          mkdir -p shared/kvoter
          python3 -m kvoter.the_odds_api --feed shared/agent/history-h2h.json --output shared/kvoter/match-report.json --raw-output shared/kvoter/league-odds-raw.json --offers-output shared/kvoter/provider-offers.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("shared/kvoter/match-report.json").read_text())
          assert report.get("provider_status")=="api_fetched", "OddsAPI fetch failed"
          assert not report.get("provider_errors"), "OddsAPI league errors - retry later"
          print("LISTASIX_KVOTER_OK",report["matched"],report["unavailable"])
          PY
      - name: Build manual review candidates
        if: steps.clock.outputs.run == 'true'
        run: |
          python3 -m kvoter.manual_candidates --history shared/agent/history-h2h.json --offers shared/kvoter/provider-offers.json --unmatched shared/kvoter/unmatched_fixtures.json --output shared/kvoter/manual-candidates.json
      - name: Publish verified text offer for mobile ListaSix page
        if: steps.clock.outputs.run == 'true'
        run: |
          python3 -m lista.publish --feed shared/collector-feed.json --matches shared/kvoter/matched_fixtures.json --shared shared --docs docs
          if [ -f docs/active-list.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("docs/active-list.json").read_text())
          assert data["publication_allowed"] and data["fixtures"]
          assert Path("docs/kvoter-ponuda.txt").is_file()
          print("LISTASIX_TEXT_OFFER_READY",len(data["fixtures"]))
          PY
          else
            echo "No verified offer for public display"
          fi
      - name: Persist Agent Kvoter and provider alias catalog
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in docs/active-list.json docs/kvoter-ponuda.txt shared/active-list.json shared/kvoter-ponuda.txt shared/agent/history-h2h.json shared/kvoter/provider-offers.json shared/kvoter/match-report.json shared/kvoter/matched_fixtures.json shared/kvoter/unmatched_fixtures.json shared/kvoter/manual-candidates.json shared/kvoter/team-database/provider-team-names.json; do
            if [ -f "$path" ]; then git add -f -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "lista: update agent and verified odds matching [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload Collector feed
        if: steps.clock.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: listasix-active-collector
          path: shared/*.json
