name: ListaSix daily pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7,8 * * *'
permissions:
  contents: read
jobs:
  lista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce 09:00 Sarajevo schedule
        if: github.event_name == 'schedule'
        run: |
          test "$(TZ=Europe/Sarajevo date +%H)" = "09" || { echo "Not 09:00 Sarajevo"; exit 0; }
      - name: Run safe setup check
        run: python3 -m lista.pipeline
      - name: Upload setup report
        uses: actions/upload-artifact@v4
        with:
          name: listasix-status
          path: data/status.json
