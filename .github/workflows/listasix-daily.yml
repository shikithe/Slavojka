name: ListaSix daily Collector Agent Kvoter
on:
  workflow_dispatch:
  schedule:
    # Check every 15 minutes; local gate starts at 09:00 Sarajevo.
    # No fixed end: retry until the day's verified active-list exists.
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: listasix-daily-and-expiry
  cancel-in-progress: false
jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retry from 09:00 Sarajevo every 15 minutes until verified list is published
        id: clock
        env:
          TRIGGER: ${{ github.event_name }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo
          local=datetime.now(ZoneInfo("Europe/Sarajevo"))
          today=local.date().isoformat()
          # No upper bound: keep retrying all day until a current
          # verified and publishable offer is committed.
          scheduled=local.time()>=time(9,0)
          current=False
          path=Path("docs/active-list.json")
          if path.exists():
              try:
                  data=json.loads(path.read_text(encoding="utf-8"))
                  current=data.get("date")==today and bool(data.get("publication_allowed")) and bool(data.get("fixtures"))
              except (ValueError,OSError):
                  pass
          allowed=(os.environ["TRIGGER"]=="workflow_dispatch") or (scheduled and not current)
          # Keep the 15-minute GitHub checks, but do not burn the Free API
          # allocation: pre-match odds refresh only about every 3 hours.
          if allowed and os.environ["TRIGGER"]!="workflow_dispatch" and os.environ.get("API_FOOTBALL_KEY"):
              marker=Path("shared/kvoter/api-football-attempt.json")
              if marker.exists():
                  try:
                      from datetime import timezone, timedelta
                      last=json.loads(marker.read_text(encoding="utf-8"))
                      when=datetime.fromisoformat(last["attempt_at_utc"]).astimezone(timezone.utc)
                      age=datetime.now(timezone.utc)-when
                      if last.get("date")==today and timedelta(0)<=age<timedelta(hours=3):
                          allowed=False
                          print("API_FOOTBALL_BACKOFF_TO_SAVE_FREE_QUOTA", "retry_after_hours=",round(3-age.total_seconds()/3600,2))
                  except (OSError, ValueError, KeyError, TypeError):
                      pass
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("run="+("true" if allowed else "false")+"\n")
          print("LISTASIX_RETRY_GATE",local.isoformat(),"current=",current,"run=",allowed)
          PY
      - name: Expire previous-day feeds before collecting
        if: steps.clock.outputs.run == 'true'
        run: |
          python3 -m lista.expire_collector
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- shared docs
          if ! git diff --cached --quiet; then
            git commit -m "lista: clear expired feeds before collection [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Collect ESPN fixtures into shared feed
        if: steps.clock.outputs.run == 'true'
        env:
          LISTASIX_SHARED: shared
        run: python3 -m lista.pipeline
      - name: Validate and persist active daily database
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          raw=json.loads(Path('shared/collector-raw.json').read_text())
          feed=json.loads(Path('shared/collector-feed.json').read_text())
          assert feed['football_candidates'], 'Empty active feed'
          assert raw['date']==feed['date']
          assert datetime.fromisoformat(feed['expires_at_utc']) > datetime.now(timezone.utc)
          assert all(raw['window_start_utc'] <= f['start_utc'].replace('Z','+00:00') < raw['window_end_utc'] for f in feed['football_candidates'])
          print('ACTIVE_FEED_VALIDATED',len(feed['football_candidates']))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- shared/collector-raw.json shared/collector-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "lista: update active ESPN feed [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build Agent history from Collector feed
        if: steps.clock.outputs.run == 'true'
        run: |
          mkdir -p shared/agent
          python3 -m unittest -v test_cross_competition_form.py
          python3 -m agent.five_matches --input shared/collector-feed.json --output shared/agent/history-h2h.json --days 120
          python3 -m agent.cross_competition_form --input shared/agent/history-h2h.json --output shared/agent/history-h2h.json --days 120
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("shared/agent/history-h2h.json").read_text())
          assert data.get("form_scope"), "Cross-competition form enrichment did not run"
          for league in ("uefa.champions","uefa.europa"):
              for name,team in data.get("leagues",{}).get(league,{}).get("teams",{}).items():
                  assert team.get("found",0)==len(team.get("matches",[])), (league,name)
                  assert team.get("found",0)<=5, (league,name)
          PY
      - name: Run Kvoter using API-Football when configured (The Odds API kept as legacy fallback)
        if: steps.clock.outputs.run == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          KVOTER_PROVIDER_NAMES_PATH: shared/kvoter/team-database/provider-team-names.json
        run: |
          mkdir -p shared/kvoter
          python3 -m unittest -v test_api_football.py test_oddsapi_uefa_markets.py
          if [ -n "$API_FOOTBALL_KEY" ]; then
            echo "KVOTER_PROVIDER=api-football-v3"
            if ! python3 -m kvoter.api_football \
              --feed shared/agent/history-h2h.json \
              --output shared/kvoter/match-report.json \
              --offers-output shared/kvoter/provider-offers.json \
              --max-event-requests 16; then
              # Persist only metadata about the attempt, not credentials,
              # to prevent repeated costly requests every 15 minutes.
              if [ -f shared/kvoter/api-football-attempt.json ]; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -f -- shared/kvoter/api-football-attempt.json
                if ! git diff --cached --quiet; then
                  git commit -m "lista: API-Football retry marker to respect free quota [skip ci]"
                  git pull --rebase origin main
                  git push origin HEAD:main
                fi
              fi
              exit 1
            fi
          else
            echo "KVOTER_PROVIDER=legacy-the-odds-api"
            test -n "$THE_ODDS_API_KEY" || { echo "::error::Both odds provider secrets missing"; exit 1; }
            python3 -m kvoter.the_odds_api --feed shared/agent/history-h2h.json \
              --output shared/kvoter/match-report.json \
              --raw-output shared/kvoter/league-odds-raw.json \
              --offers-output shared/kvoter/provider-offers.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("shared/kvoter/match-report.json").read_text())
          assert report.get("provider_status")=="api_fetched", "Odds provider fetch failed"
          assert report.get("matched",0)>0, "No independently verified bookmaker matches"
          errors=report.get("provider_errors",[])
          if report.get("source")=="api-football-v3":
              print("API_FOOTBALL_QUOTES_READY", "matched=",report["matched"],
                    "total=",report["total"],"provider_errors=",len(errors))
          else:
              fallback=report.get("provider_cached_fallback",{})
              if errors:
                  print("ODDSAPI_PARTIAL_FAILURE_RECOVERED",errors,"cached_quotes_by_league",fallback)
                  failed_leagues={x.get("league") for x in errors}
                  assert all(fallback.get(league,0)>0 for league in failed_leagues), (
                      "A failed league lacks recent cached quotes; preserve existing public offer")
                  old=Path("docs/active-list.json")
                  if old.exists():
                      previous=json.loads(old.read_text())
                      if previous.get("date")==json.loads(Path("shared/collector-feed.json").read_text())["date"]:
                          assert report["matched"]>=len(previous.get("fixtures",[])), (
                              "Partial provider error would shrink verified active-list")
          PY
      - name: Build manual review candidates
        if: steps.clock.outputs.run == 'true'
        run: |
          python3 -m kvoter.manual_candidates --history shared/agent/history-h2h.json --offers shared/kvoter/provider-offers.json --unmatched shared/kvoter/unmatched_fixtures.json --output shared/kvoter/manual-candidates.json
      - name: Export Kvoter Manual queue to GitHub Pages
        if: steps.clock.outputs.run == 'true'
        run: |
          cp shared/kvoter/manual-candidates.json docs/manual-candidates.json
          cp shared/kvoter/unmatched_fixtures.json docs/unmatched_fixtures.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          unmatched=json.loads(Path("docs/unmatched_fixtures.json").read_text())
          candidates=json.loads(Path("docs/manual-candidates.json").read_text())
          ids={f["fixture_id"] for f in unmatched["fixtures"]}
          assert all(f["fixture_id"] in ids for f in candidates["fixtures"])
          print("KVOTER_MANUAL_QUEUE_PUBLISHED",len(ids),candidates["total"])
          PY
      - name: Publish verified text offer for mobile ListaSix page
        if: steps.clock.outputs.run == 'true'
        run: |
          python3 -m lista.publish --feed shared/collector-feed.json --matches shared/kvoter/matched_fixtures.json --shared shared --docs docs
          if [ -f docs/active-list.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("docs/active-list.json").read_text())
          assert data["publication_allowed"] and data["fixtures"]
          assert Path("docs/kvoter-ponuda.txt").is_file()
          print("LISTASIX_TEXT_OFFER_READY",len(data["fixtures"]))
          PY
          else
            echo "No verified offer for public display"
          fi
      - name: Persist Agent Kvoter and provider alias catalog
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in docs/manual-candidates.json docs/unmatched_fixtures.json docs/active-list.json docs/kvoter-ponuda.txt shared/active-list.json shared/kvoter-ponuda.txt shared/agent/history-h2h.json shared/kvoter/provider-offers.json shared/kvoter/match-report.json shared/kvoter/matched_fixtures.json shared/kvoter/unmatched_fixtures.json shared/kvoter/manual-candidates.json shared/kvoter/team-database/provider-team-names.json; do
            if [ -f "$path" ]; then git add -f -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "lista: update agent and verified odds matching [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload Collector feed
        if: steps.clock.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: listasix-active-collector
          path: shared/*.json
