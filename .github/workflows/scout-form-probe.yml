name: SAFE cross-competition ESPN form probe
on:
  push:
    branches: [test/top10-multicompetition-form-20261124]
    paths: ['.github/workflows/scout-form-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test all-competition ESPN schedule for a verified CL club
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen,Request
          from urllib.parse import urlencode
          def get(path,params=None):
              u="https://site.api.espn.com/apis/site/v2/sports/soccer/"+path
              if params: u+="?"+urlencode(params)
              with urlopen(Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=24) as r:
                  return json.load(r)
          board=get("uefa.champions/scoreboard",{"dates":"202611","limit":500})
          target=next((e for e in board.get("events",[]) if str(e.get("id"))=="401915295"),None)
          print("BOARD",len(board.get("events",[])),"TARGET_EXISTS",bool(target))
          if not target: raise SystemExit("Current fixture not in ESPN month scoreboard")
          comp=target["competitions"][0]
          teams=[(x["team"].get("displayName"),x["team"].get("id")) for x in comp["competitors"]]
          print("TEAMS",teams)
          name,tid=next(((n,i) for n,i in teams if "Arsenal" in str(n)),teams[0])
          for league in ("all","uefa.champions","eng.1"):
              try:
                  doc=get(f"{league}/teams/{tid}/schedule",{"dates":"2026"})
                  events=doc.get("events",[])
                  print("SCHEDULE",league,"TEAM",name,"COUNT",len(events),"HEAD",json.dumps(events[:2])[:1500])
                  from lista.scout_history import parsed_event,scoreboard_team_ids
                  from datetime import date
                  print("SCHEDULE_PARSED",league,[(e.get("id"),e.get("status"),bool(parsed_event(e,"all",date(2026,11,24)))) for e in events[:3]])
                  print("FIXTURE_SOURCE_TEAM_IDS",scoreboard_team_ids(target))
                  print("SCHEDULE_SCORE_SNAPSHOT",league,[(e.get("id"),e.get("date"),
                     e.get("competitions",[{}])[0].get("status"),
                     [(x.get("homeAway"),x.get("score"),x.get("winner"))
                      for x in e.get("competitions",[{}])[0].get("competitors",[])])
                     for e in events[:3]])

              except Exception as ex:
                  print("SCHEDULE_ERROR",league,str(ex)[:300])
          print("PROBE_DONE_NO_GITHUB_WRITES")
          PY
      - name: Validate isolated TOP10, source identity, and existing Scout regressions
        run: |
          python3 -m compileall -q lista
          python3 -m unittest discover -s tests -p test_top10_multicompetition.py -v
          python3 -m unittest discover -s tests -p test_scout_six_markets.py -v
          python3 -m unittest discover -s tests -p test_scout_feedback.py -v
          python3 -m unittest discover -s tests -p test_scout_history_fallback.py -v
      - name: Real ESPN cross-competition history and full TOP10 dry run (no push)
        run: |
          python3 -m lista.scout_history
          python3 -m lista.scout_six_markets
          python3 -m lista.scout_feedback
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("shared/agent/scout-six-markets.json").read_text())
          history=json.loads(Path("shared/agent/history-h2h.json").read_text())
          feedback=json.loads(Path("shared/agent/top10-feedback.json").read_text())
          ucl=history["leagues"]["uefa.champions"]["teams"]
          form={k:v["found"] for k,v in ucl.items()}
          print("REAL_ESPN_UCL_FORM",json.dumps(form,ensure_ascii=False,sort_keys=True))
          print("REAL_HISTORY_AUGMENTED",history.get("cross_competition_teams_enriched"),
                "COMPETITION_SOURCES",history.get("form_competitions_scanned"))
          print("REAL_TOP10",feedback["feedback"],feedback["count"],"FROM",
                report["all_fixtures_evaluated"],"A_ELIGIBLE",report["candidate_A_count"])
          assert report["all_fixtures_evaluated"]>=10
          assert report["all_six_odds_present"]>=10
          assert feedback["count"]==10
          assert any(n>=5 for n in form.values())
          assert feedback["publication_allowed"] is False
          print("READ_ONLY_TOP10_10_CONFIRMED")
          PY
