name: ListaSix 19:45 one-time test trigger
on:
  workflow_dispatch:
  schedule:
    # 19:45 Europe/Sarajevo = 18:45 UTC in November; second slot for summer DST.
    - cron: '45 17,18 2 11 *'
permissions:
  actions: write
  contents: read
jobs:
  dispatch-test-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Run isolated test once in Sarajevo 19:45 window
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          local=datetime.now(ZoneInfo('Europe/Sarajevo'))
          valid=local.date().isoformat()=='2026-11-02' and time(19,45)<=local.time()<time(20,15)
          if not valid:
              print('OUTSIDE_TEST_WINDOW',local.isoformat())
              raise SystemExit(0)
          import os,subprocess
          cmd=['gh','workflow','run','listasix-collector-test-1945.yml','--ref','test/collector-1945-20261102']
          subprocess.run(cmd,check=True)
          print('DISPATCHED_ISOLATED_COLLECTOR',local.isoformat())
          PY
