name: ListaSix raw schedule heartbeat
on:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Print raw schedule event
        run: |
          echo "TRIGGER OK"
          echo "event=${{ github.event_name }}"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
