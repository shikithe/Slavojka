name: ListaSix ready PR one-time smoke signal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-ready-pr-signal-once.yml'
permissions:
  contents: read
jobs:
  signal-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify ListaSix ready list and send one safe dispatch
        env:
          MEMARASIX_DISPATCH_TOKEN: ${{ secrets.MEMARASIX_DISPATCH_TOKEN }}
        run: |
          python3 - <<'PY'
          from datetime import datetime,timezone
          from pathlib import Path
          from lista.notify_memarasix import verify_source,dispatch
          import os,json
          token=os.environ.get("MEMARASIX_DISPATCH_TOKEN")
          if not token:
              raise SystemExit("MISSING_DISPATCH_TOKEN")
          signal=verify_source(Path("."), datetime.now(timezone.utc))
          dispatch(signal,token)
          print("LISTASIX_READY_PR_TEST_EVENT_SENT",json.dumps(signal))
          PY
