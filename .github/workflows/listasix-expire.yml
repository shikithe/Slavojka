name: ListaSix expiry window from 08:59 until old feed removed
on:
  workflow_dispatch:
  schedule:
    # Starts near 08:59 Sarajevo; retry every five minutes until expired data is gone.
    # UTC slots cover DST; local gate prevents deletion before 08:59.
    - cron: '59 6,7 * * *'
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: listasix-daily-and-expiry
  cancel-in-progress: false
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep expiry window open from 08:59 while old Collector feed exists
        id: clock
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, time, date
          from pathlib import Path
          from zoneinfo import ZoneInfo
          local = datetime.now(ZoneInfo("Europe/Sarajevo"))
          feed = Path("shared/collector-feed.json")
          old = False
          if feed.exists():
              try:
                  stamp = json.loads(feed.read_text(encoding="utf-8")).get("date")
                  old = bool(stamp) and date.fromisoformat(stamp) < local.date()
              except (OSError, ValueError, TypeError):
                  old = True  # damaged feed: attempt cleanup and let script report any error
          due = local.time() >= time(8,59)
          allowed = (os.environ["TRIGGER"] == "workflow_dispatch" or due) and old
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("run=" + ("true" if allowed else "false") + "\n")
          print("LISTASIX_EXPIRY_WINDOW", local.isoformat(), "old_feed=", old, "run=", allowed)
          PY
      - name: Remove expired previous-day Collector Agent Kvoter public feeds
        if: steps.clock.outputs.run == 'true'
        run: |
          python3 -m lista.expire_collector
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- shared docs/active-list.json docs/kvoter-ponuda.txt docs/manual-candidates.json docs/unmatched_fixtures.json
          if ! git diff --cached --quiet; then
            git commit -m "lista: expire previous-day feeds at 08:59 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
