name: ListaSix ESPN Scout last-five results - daily handoff
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lista/scout_history.py'
      - 'lista/notify_memarasix.py'
      - '.github/workflows/listasix-scout-history.yml'
  schedule:
    - cron: '5,25,45 8-11 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: listasix-espn-history
  cancel-in-progress: false
jobs:
  collect-form:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect real ESPN scoreboards for daily match history
        run: python3 -m lista.scout_history
      - name: Commit current ESPN last-five history only
        id: save
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- shared/agent/history-h2h.json
          if ! git diff --cached --quiet; then
            git commit -m "ListaSix ESPN current last-five scout history [skip ci]"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                break
              fi
              if [ "$attempt" = 4 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Feedback — fresh history saved, now trigger existing Scout 6/6
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run listasix-scout-six-markets.yml --repo "$GH_REPO" --ref main
          echo "HISTORY_READY_SCOUT_6OF6_DISPATCHED"
      - name: Signal MemaraSix after results and AI prices are ready
        env:
          MEMARASIX_DISPATCH_TOKEN: ${{ secrets.MEMARASIX_DISPATCH_TOKEN }}
        run: |
          git pull --ff-only origin main
          python3 -m lista.notify_memarasix
