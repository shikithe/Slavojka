name: ListaSix ESPN Scout last-five results - daily handoff
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lista/scout_history.py'
      - 'lista/notify_memarasix.py'
      - '.github/workflows/listasix-scout-history.yml'
  schedule:
    - cron: '5,25,45 8-11 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: listasix-espn-history
  cancel-in-progress: false
jobs:
  collect-form:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Only continue after today's confirmed ODDS_READY
        id: source
        run: |
          python3 - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          def read(p):
              try: return json.loads(Path(p).read_text(encoding="utf-8"))
              except (ValueError,OSError): return {}
          feed=read("shared/collector-feed.json")
          active=read("shared/active-list.json")
          fb=read("shared/kvoter/coverage-feedback.json")
          hist=read("shared/agent/history-h2h.json")
          ids=[f.get("fixture_id") for f in feed.get("football_candidates",[])]
          quoted=sum(any(isinstance(x.get(k),(int,float)) and not isinstance(x.get(k),bool)
                         and 1.01<x[k]<50 for k in
                         ("home_odds","draw_odds","away_odds","over25_odds","btts_yes_odds","btts_no_odds"))
                     for x in active.get("fixtures",[]))
          ready=(feed.get("date")==active.get("date")==fb.get("date")==today
                 and bool(ids) and len(set(ids))==len(ids) and None not in ids
                 and set(ids)=={x.get("fixture_id") for x in active.get("fixtures",[])}
                 and fb.get("feedback")=="ODDS_READY" and fb.get("final") is True
                 and fb.get("status")=="ready_for_scout"
                 and fb.get("matched_with_quotes")==quoted
                 and fb.get("espn_total")==len(ids))
          previous={x.get("fixture_id") for x in hist.get("fixtures",[])}
          complete=(ready and hist.get("date")==today
                    and previous==set(ids) and bool(hist.get("leagues"))
                    and hist.get("history_status") not in ("unavailable_no_fabrication","incomplete_no_fabrication"))
          run=ready and not complete
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("ready="+str(ready).lower()+"\n")
              output.write("complete="+str(complete).lower()+"\n")
              output.write("run="+str(run).lower()+"\n")
          print("HISTORY_AFTER_ODDS",today,"ODDS_READY=",ready,
                "history_complete=",complete,"collect=",run)
          PY
      - name: Collect real ESPN scoreboards for daily match history
        if: steps.source.outputs.run == 'true'
        run: python3 -m lista.scout_history
      - name: Commit current ESPN last-five history only
        if: steps.source.outputs.run == 'true'
        id: save
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- shared/agent/history-h2h.json
          if ! git diff --cached --quiet; then
            git commit -m "ListaSix ESPN current last-five scout history [skip ci]"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                break
              fi
              if [ "$attempt" = 4 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Feedback — fresh history saved, now trigger existing Scout 6/6
        if: steps.source.outputs.ready == 'true' && (steps.source.outputs.complete == 'true' || steps.save.outputs.changed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run listasix-scout-six-markets.yml --repo "$GH_REPO" --ref main
          echo "HISTORY_READY_SCOUT_6OF6_DISPATCHED"
      - name: Signal MemaraSix after results and AI prices are ready
        if: steps.source.outputs.run == 'true'
        env:
          MEMARASIX_DISPATCH_TOKEN: ${{ secrets.MEMARASIX_DISPATCH_TOKEN }}
        run: |
          git pull --ff-only origin main
          python3 -m lista.notify_memarasix
