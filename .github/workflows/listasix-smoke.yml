name: ListaSix integration smoke test
on:
  push:
    paths:
      - '.github/workflows/listasix-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate imported Python syntax
        run: python3 -m compileall -q lista collector kvoter agent collector.py
      - name: Validate timezone window and expiration
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from lista.pipeline import window
          from lista.publish import expiry
          tz=ZoneInfo("Europe/Sarajevo")
          for d in ("2026-11-01T10:00:00+01:00","2027-07-01T10:00:00+02:00"):
              start,end=window(datetime.fromisoformat(d))
              assert start.hour==13 and end.hour==13
              assert expiry(start.date()).endswith("11:59:00+01:00") or expiry(start.date()).endswith("11:59:00+02:00")
          print("WINDOW_AND_EXPIRY_OK")
          PY
      - name: Test OddsAPI identity lifecycle and automatic reconciliation
        run: |
          python3 - <<'PY'
          import json,tempfile
          from pathlib import Path
          from kvoter.reconcile import reconcile
          from kvoter.reconcile_trigger import run_once
          with tempfile.TemporaryDirectory() as d:
              root=Path(d); h=root/"history.json"; o=root/"provider-offers.json"
              db=root/"database.json"; names=root/"team-database/provider-team-names.json"
              out=root/"out";state=root/"state"
              h.write_text(json.dumps({"fixtures":[{"fixture_id":"1","league":"eng.1","home":"Example United","away":"Another FC","start_utc":"2026-11-01T15:00:00Z"}]}))
              o.write_text(json.dumps({"offers":[{"event_id":"odds-1","league":"eng.1","home":"Example United FC","away":"Another FC","start_utc":"2026-11-01T15:00:00Z","bookmaker":"demo","markets":{"1X2":{"home":2.0}}}]}))
              db.write_text(json.dumps({"teams":[]}))
              report=reconcile(h,o,db,names,out)
              assert report["matched"]==0 and report["unavailable"]==1
              assert any(n["name"]=="Example United FC" for n in json.loads(names.read_text())["names"])
              db.write_text(json.dumps({"teams":[{"id":"example","league":"eng.1","names":["Example United FC","Example United"],"verified":True}]}))
              assert run_once(h,o,db,names,out,state).startswith("reconciled")
              assert json.loads((out/"matched_fixtures.json").read_text())["total"]==1
              assert json.loads((out/"unmatched_fixtures.json").read_text())["total"]==0
              assert run_once(h,o,db,names,out,state)=="waiting: no change"
          print("KVOTER_LIFECYCLE_OK")
          PY

      - name: Simulate manual alias confirmation for guest with suffix 07
        run: |
          python3 - <<'PY'
          import json,tempfile
          from pathlib import Path
          from kvoter.reconcile import reconcile
          from kvoter.manual_aliases import approve
          from kvoter.reconcile_trigger import run_once
          from kvoter.manual_candidates import build as candidates
          with tempfile.TemporaryDirectory() as d:
              root=Path(d); history=root/"history-h2h.json"; offers=root/"provider-offers.json"
              db_path=root/"team-database.json"; names=root/"provider-team-names.json"; out=root/"kvoter";state=root/"state"
              fixture={"fixture_id":"test-07","league":"ger.1","home":"Teststadt","away":"Gastverein","start_utc":"2026-11-02T17:00:00Z"}
              event={"event_id":"odds-07","league":"ger.1","home":"Teststadt","away":"Gastverein 07","start_utc":"2026-11-02T17:00:00Z","bookmaker":"simulated","markets":{"1X2":{"home":2.1}}}
              history.write_text(json.dumps({"fixtures":[fixture]}));offers.write_text(json.dumps({"offers":[event]}))
              db_path.write_text(json.dumps({"schema_version":1,"teams":[]}))
              before=reconcile(history,offers,db_path,names,out)
              assert before["matched"]==0 and before["unavailable"]==1
              assert json.loads((out/"unmatched_fixtures.json").read_text())["fixtures"][0]["fixture_id"]=="test-07"
              assert "Gastverein 07" in [n["name"] for n in json.loads(names.read_text())["names"]]
              suggestions=candidates({"fixtures":[fixture]},{"offers":[event]},{"fixtures":[fixture]})
              assert suggestions["fixtures"][0]["candidates"][0]["event_id"]=="odds-07"
              # Emulate explicit user pressing Matched and confirming via GitHub Issue.
              approval={"fixture_id":"test-07","event_id":"odds-07","league":"ger.1","collector_home":"Teststadt","collector_away":"Gastverein","odds_home":"Teststadt","odds_away":"Gastverein 07","decision":"matched"}
              db=json.loads(db_path.read_text());approve(db,approval,"simulated-user-confirmation")
              db_path.write_text(json.dumps(db))
              assert run_once(history,offers,db_path,names,out,state).startswith("reconciled")
              assert json.loads((out/"matched_fixtures.json").read_text())["total"]==1
              assert json.loads((out/"unmatched_fixtures.json").read_text())["total"]==0
              assert any(set(t["names"])=={"Gastverein","Gastverein 07"} for t in json.loads(db_path.read_text())["teams"])
          print("MANUAL_07_ALIAS_CONFIRMATION_OK")
          PY

      - name: Simulate full Collector Agent Kvoter Manual lifecycle offline
        run: |
          python3 - <<'PY'
          import json,tempfile
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from unittest.mock import patch
          from lista.pipeline import window,main as collector_main
          from agent.five_matches import build as agent_build
          from kvoter.the_odds_api import collect as odds_collect
          from kvoter.reconcile import reconcile
          from kvoter.manual_aliases import approve
          from kvoter.reconcile_trigger import run_once
          tz=ZoneInfo("Europe/Sarajevo")
          start,end=window(datetime(2026,11,2,12,tzinfo=tz))
          assert start.hour==13 and end.hour==13
          kickoff="2026-11-02T17:00:00+00:00"
          fixture={"id":"sim-1","home":"Teststadt","away":"Gastverein","league":"ger.1","start_utc":kickoff,"sport":"football","status":"pre"}
          def fake_collect(s,end_utc=None,football_only=False):
              assert football_only and s.hour==12 and end_utc.hour==12
              return {"fixtures":[fixture],"errors":[],"window_start_utc":s.isoformat(),"window_end_utc":end_utc.isoformat()}
          with tempfile.TemporaryDirectory() as d:
              root=Path(d); shared=root/"shared";shared.mkdir()
              with patch("lista.pipeline.collect",side_effect=fake_collect),patch("lista.pipeline.ROOT",shared),patch("lista.pipeline.datetime") as dt:
                  dt.now.return_value=datetime(2026,11,2,12,30,tzinfo=ZoneInfo("UTC"))
                  dt.combine=datetime.combine
                  assert collector_main()==0
              feed=json.loads((shared/"collector-feed.json").read_text())
              assert len(feed["football_candidates"])==1
              history=agent_build(feed,request=lambda url:{"events":[]},days=5,last=5)
              h=shared/"agent/history-h2h.json";h.parent.mkdir();h.write_text(json.dumps(history))
              event={"id":"odds-07","home_team":"Teststadt","away_team":"Gastverein 07","commence_time":kickoff,
                     "bookmakers":[{"key":"simulation","markets":[{"key":"h2h","outcomes":[{"name":"Teststadt","price":2.1},{"name":"Gastverein 07","price":3.4}]}]}]}
              def fake_odds(url): return [event]
              offers,raw,coverage,errors=odds_collect(history,"TEST-ONLY",fetch=fake_odds)
              assert not errors and offers and offers[0]["away"]=="Gastverein 07"
              offers_path=shared/"kvoter/provider-offers.json";offers_path.parent.mkdir();offers_path.write_text(json.dumps({"offers":offers}))
              db=shared/"team-database.json";db.write_text(json.dumps({"teams":[]}))
              names=shared/"provider-team-names.json";out=shared/"kvoter";state=out/".reconcile-state"
              report=reconcile(h,offers_path,db,names,out)
              assert report["unavailable"]==1 and report["matched"]==0
              assert "Gastverein 07" in [n["name"] for n in json.loads(names.read_text())["names"]]
              data=json.loads(db.read_text())
              approve(data,{"decision":"matched","league":"ger.1","collector_home":"Teststadt","odds_home":"Teststadt",
                  "collector_away":"Gastverein","odds_away":"Gastverein 07"},"simulated-manual-confirmation")
              db.write_text(json.dumps(data))
              assert run_once(h,offers_path,db,names,out,state).startswith("reconciled")
              assert json.loads((out/"matched_fixtures.json").read_text())["total"]==1
              assert json.loads((out/"unmatched_fixtures.json").read_text())["total"]==0
          print("FULL_LISTASIX_OFFLINE_LIFECYCLE_OK")
          PY

      - name: Test primary and manual offer merge without real odds
        run: |
          python3 - <<'PY'
          import json,tempfile
          from pathlib import Path
          from lista.publish import publish
          with tempfile.TemporaryDirectory() as d:
              p=Path(d);(p/"shared").mkdir();(p/"docs").mkdir()
              feed={"date":"2026-11-01","football_candidates":[{"fixture_id":"fixture1"},{"fixture_id":"fixture2"}]}
              def match(fid):
                  return {"fixture_id":fid,"home":"Home","away":"Away","start_utc":"2026-11-01T12:00:00Z","odds_offers":[{"bookmaker":"test-only","markets":{"1X2":{"home":2.0,"draw":3.0,"away":4.0},"3+":{"over":1.8}}}]}
              (p/"feed.json").write_text(json.dumps(feed))
              (p/"matches.json").write_text(json.dumps({"matched_fixtures":[match("fixture1")]}))
              (p/"manual.json").write_text(json.dumps({"matched_fixtures":[match("fixture2")]}))
              n=publish(p/"feed.json",p/"matches.json",p/"manual.json",p/"shared",p/"docs")
              assert n==2
              data=json.loads((p/"docs/active-list.json").read_text())
              assert len(data["fixtures"])==2
              assert "fixture1" in (p/"docs/kvoter-ponuda.txt").read_text() or "Home - Away" in (p/"docs/kvoter-ponuda.txt").read_text()
              print("PRIMARY_MANUAL_MERGE_OK")
          PY

# rerun after syntax fixes
# rerun collector string fix
# rerun after collector package import fix

      - name: Test Agent trigger and five-match handoff offline
        run: |
          python3 - <<'PY'
          import json, tempfile
          from pathlib import Path
          from unittest.mock import patch
          from agent.shared_volume_trigger import eligible, run_once
          from agent.five_matches import build
          feed={"date":"2026-11-01","football_candidates":[{"fixture_id":"test-1","home":"Alpha","away":"Beta","league":"eng.1","sport":"football","start_utc":"2026-11-01T12:00:00Z"}]}
          assert eligible(json.dumps(feed).encode())
          assert not eligible(json.dumps({"football_candidates":[]}).encode())
          with tempfile.TemporaryDirectory() as d:
              p=Path(d); source=p/"collector-feed.json"; output=p/"agent/history-h2h.json"; state=p/"agent/state"
              source.write_text(json.dumps(feed))
              script=p/"fake_agent.py"
              script.write_text("import argparse,json\nfrom pathlib import Path\np=argparse.ArgumentParser();p.add_argument('--input');p.add_argument('--output');a=p.parse_args();f=json.loads(Path(a.input).read_text());Path(a.output).write_text(json.dumps({'fixture_count':len(f['football_candidates'])}))\n")
              with patch("agent.shared_volume_trigger.time.sleep",return_value=None):
                  assert run_once(source,output,state,script).startswith("processed:")
                  assert json.loads(output.read_text())["fixture_count"]==1
                  assert run_once(source,output,state,script)=="waiting: feed already processed"
              result=build(feed,request=lambda url: {"events":[]},days=5,last=5)
              assert "eng.1" in result["leagues"]
              assert len(result["leagues"]["eng.1"]["teams"])==2
              print("AGENT_TRIGGER_AND_HANDOFF_OFFLINE_OK")
          PY

# rerun Agent import fix

# trigger integration check after imports corrected
