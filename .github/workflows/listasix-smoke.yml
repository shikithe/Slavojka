name: ListaSix integration smoke test
on:
  push:
    paths:
      - '.github/workflows/listasix-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate imported Python syntax
        run: python3 -m compileall -q lista collector kvoter agent collector.py
      - name: Validate timezone window and expiration
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from lista.pipeline import window
          from lista.publish import expiry
          tz=ZoneInfo("Europe/Sarajevo")
          for d in ("2026-11-01T10:00:00+01:00","2027-07-01T10:00:00+02:00"):
              start,end=window(datetime.fromisoformat(d))
              assert start.hour==11 and end.hour==11
              assert expiry(start.date()).endswith("09:59:00+01:00") or expiry(start.date()).endswith("09:59:00+02:00")
          print("WINDOW_AND_EXPIRY_OK")
          PY
      - name: Test primary and manual offer merge without real odds
        run: |
          python3 - <<'PY'
          import json,tempfile
          from pathlib import Path
          from lista.publish import publish
          with tempfile.TemporaryDirectory() as d:
              p=Path(d);(p/"shared").mkdir();(p/"docs").mkdir()
              feed={"date":"2026-11-01","football_candidates":[{"fixture_id":"fixture1"},{"fixture_id":"fixture2"}]}
              def match(fid):
                  return {"fixture_id":fid,"home":"Home","away":"Away","start_utc":"2026-11-01T11:00:00Z","odds_offers":[{"bookmaker":"test-only","markets":{"1X2":{"home":2.0,"draw":3.0,"away":4.0},"3+":{"over":1.8}}}]}
              (p/"feed.json").write_text(json.dumps(feed))
              (p/"matches.json").write_text(json.dumps({"matched_fixtures":[match("fixture1")]}))
              (p/"manual.json").write_text(json.dumps({"matched_fixtures":[match("fixture2")]}))
              n=publish(p/"feed.json",p/"matches.json",p/"manual.json",p/"shared",p/"docs")
              assert n==2
              data=json.loads((p/"docs/active-list.json").read_text())
              assert len(data["fixtures"])==2
              assert "fixture1" in (p/"docs/kvoter-ponuda.txt").read_text() or "Home - Away" in (p/"docs/kvoter-ponuda.txt").read_text()
              print("PRIMARY_MANUAL_MERGE_OK")
          PY

# rerun after syntax fixes
# rerun collector string fix
# rerun after collector package import fix

      - name: Test Agent trigger and five-match handoff offline
        run: |
          python3 - <<'PY'
          import json, tempfile
          from pathlib import Path
          from unittest.mock import patch
          from agent.shared_volume_trigger import eligible, run_once
          from agent.five_matches import build
          feed={"date":"2026-11-01","football_candidates":[{"fixture_id":"test-1","home":"Alpha","away":"Beta","league":"eng.1","sport":"football","start_utc":"2026-11-01T11:00:00Z"}]}
          assert eligible(json.dumps(feed).encode())
          assert not eligible(json.dumps({"football_candidates":[]}).encode())
          with tempfile.TemporaryDirectory() as d:
              p=Path(d); source=p/"collector-feed.json"; output=p/"agent/history-h2h.json"; state=p/"agent/state"
              source.write_text(json.dumps(feed))
              script=p/"fake_agent.py"
              script.write_text("import argparse,json\nfrom pathlib import Path\np=argparse.ArgumentParser();p.add_argument('--input');p.add_argument('--output');a=p.parse_args();f=json.loads(Path(a.input).read_text());Path(a.output).write_text(json.dumps({'fixture_count':len(f['football_candidates'])}))\n")
              with patch("agent.shared_volume_trigger.time.sleep",return_value=None):
                  assert run_once(source,output,state,script).startswith("processed:")
                  assert json.loads(output.read_text())["fixture_count"]==1
                  assert run_once(source,output,state,script)=="waiting: feed already processed"
              result=build(feed,request=lambda url: {"events":[]},days=5,last=5)
              assert "eng.1" in result["leagues"]
              assert len(result["leagues"]["eng.1"]["teams"])==2
              print("AGENT_TRIGGER_AND_HANDOFF_OFFLINE_OK")
          PY

# rerun Agent import fix
