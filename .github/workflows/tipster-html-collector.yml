name: ListaSix TipsterArea HTML collector (ESPN -> 1X2, 3+, GG/NG)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [espn-feed-ready]
  push:
    branches: [main]
    paths:
      - 'kvoter/tipster_collector.py'
      - 'kvoter/team_matcher.py'
      - 'tests/test_tipster_collector.py'
      - 'lista/tipster_feedback_cycle.py'
      - 'tests/test_tipster_feedback_cycle.py'
      - 'shared/kvoter/ai-verified-*.json'  # sensor can supply verified missing quotes
      - '.github/workflows/tipster-html-collector.yml'
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: listasix-tipster-html-collector
  cancel-in-progress: false
jobs:
  collect-tipster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public HTML parser
        run: python3 -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Test date, odds markets and home-away validation
        run: python3 -m unittest discover -s tests -p 'test_tipster_collector.py' -v
      - name: First verify the fresh ESPN collector, then fetch TipsterArea
        run: python3 -m kvoter.tipster_collector
      - name: Update the public Kvoter Dnevna kladionicarska ponuda directly
        run: python3 -m lista.publish_ai_offer
      - name: Initial feedback — detect unpaired ESPN fixtures
        id: feedback
        run: |
          python3 -m unittest discover -s tests -p 'test_odds_feedback.py' -v
          python3 -m lista.odds_feedback
      - name: Independent second-pass identity matching for all still-missing quotes
        if: steps.feedback.outputs.ready == 'false'
        run: |
          python3 -m kvoter.tipster_collector --secondary --force || echo "SECONDARY_MATCHING_FAILED: preserve existing verified odds and notify sensor"
          python3 -m lista.publish_ai_offer
      - name: Third-pass canonical team identity, competition and UTC kickoff
        if: steps.feedback.outputs.ready == 'false'
        run: |
          python3 -m kvoter.tipster_collector --tertiary --force || echo "TERTIARY_MATCHING_FAILED: preserve verified data and notify sensor"
          python3 -m lista.publish_ai_offer
      - name: Final feedback — proceed with collected prices, even if some names stay unmatched
        id: final_feedback
        run: |
          python3 -m unittest discover -s tests -p 'test_tipster_feedback_cycle.py' -v
          python3 -m lista.tipster_feedback_cycle
      - name: Commit collected odds AND visible daily list in the same workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- 'shared/kvoter/ai-verified-'*.json shared/kvoter/tipster-status.json shared/kvoter/coverage-feedback.json docs/active-list.json shared/active-list.json docs/kvoter-ponuda.txt shared/kvoter-ponuda.txt 
          if ! git diff --cached --quiet; then
            git commit -m "ListaSix: TipsterArea HTML odds update [skip ci]"
            # Another service may commit while this action is collecting; retry safe fast-forward pushes.
            for attempt in 1 2 3 4 5; do
              git -c rebase.autoStash=true pull --rebase origin main
              if git push origin HEAD:main; then
                echo "TIPSTER_PUBLIC_OFFER_COMMITTED"
                break
              fi
              if [ "$attempt" = 5 ]; then echo "TIPSTER_PUSH_FAILED" >&2; exit 1; fi
              sleep $((attempt * 2))
            done
          else
            echo "TIPSTER_NO_NEW_PRICES"
          fi

      - name: Sensor handoff - report unresolved quotes after the third pass
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          fb=json.loads(Path("shared/kvoter/coverage-feedback.json").read_text(encoding="utf-8"))
          title=f"ListaSix odds recovery — {fb['date']}"
          found=subprocess.run(["gh","issue","list","--repo",os.environ["GH_REPO"],
                "--state","all","--search",title,"--json","title,number,state"],
                check=True,capture_output=True,text=True)
          records=[x for x in json.loads(found.stdout) if x["title"]==title]
          if fb.get("coverage_status")=="complete":
              for issue in records:
                  if issue["state"].upper()=="OPEN":
                      subprocess.run(["gh","issue","close",str(issue["number"]),
                          "--repo",os.environ["GH_REPO"],
                          "--comment","ODDS_COMPLETE: all ESPN fixtures now have at least one verified quote."],check=True)
              print("ODDS_COMPLETE_NO_SENSOR_WORK")
              raise SystemExit(0)
          if fb.get("coverage_status")!="partial" or not fb.get("sensor_action_required"):
              raise SystemExit("Invalid final odds coverage for sensor")
          missing=fb.get("sensor_missing_fixtures") or []
          body=("ODDS_PARTIAL_READY: three identification passes attempted.\n"
                f"Quoted {fb['matched_with_quotes']}/{fb['espn_total']}; "
                f"still missing {len(missing)}. Only use verified source prices.\n"
                "Sensor may add confirmed missing markets to same-day "
                "shared/kvoter/ai-verified-YYYY-MM-DD.json, then re-run TipsterArea. "
                "Never invent or overwrite existing quotes.\n\n"
                + "\n".join(f"- {x['fixture_id']} | {x['league']} | {x['home']} - {x['away']} | {x['start_utc']}"
                            for x in missing))
          if not records:
              subprocess.run(["gh","issue","create","--repo",os.environ["GH_REPO"],
                              "--title",title,"--body",body],check=True)
          elif records[0]["state"].upper()=="OPEN":
              subprocess.run(["gh","issue","edit",str(records[0]["number"]),
                             "--repo",os.environ["GH_REPO"],"--body",body],check=True)
          print("ODDS_SENSOR_PENDING",len(missing))
          PY
      - name: ODDS_READY feedback - dispatch History only after committed quotes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import json, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          def remote(name):
              return json.loads(subprocess.check_output(["git","show","origin/main:"+name],text=True))
          feed=remote("shared/collector-feed.json")
          active=remote("shared/active-list.json")
          signal=remote("shared/kvoter/coverage-feedback.json")
          ids={x.get("fixture_id") for x in feed.get("football_candidates",[])}
          quoted=[x for x in active.get("fixtures",[]) if any(
              isinstance(x.get(k),(int,float)) and not isinstance(x.get(k),bool) and 1.01<x[k]<50
              for k in ("home_odds","draw_odds","away_odds","over25_odds","btts_yes_odds","btts_no_odds"))]
          if not (feed.get("date")==active.get("date")==signal.get("date")==today
                  and ids and ids=={x.get("fixture_id") for x in active.get("fixtures",[])}
                  and signal.get("feedback")=="ODDS_READY" and signal.get("final") is True
                  and len(quoted)>0
                  and signal.get("matched_with_quotes")==len(quoted)
                  and signal.get("espn_total")==len(ids)):
              raise SystemExit("ODDS_READY_NOT_COMMITTED_OR_INCONSISTENT")
          print("ODDS_READY_CONFIRMED",today,len(quoted),"/",len(ids))
          PY
          gh workflow run listasix-scout-history.yml --repo "$GH_REPO" --ref main
          echo "ODDS_READY_HISTORY_DISPATCH_ACCEPTED"
