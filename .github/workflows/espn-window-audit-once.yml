name: ESPN audit - 09 Nov 2026 source window
on:
  push:
    branches: [main]
    paths: ['.github/workflows/espn-window-audit-once.yml']
permissions:
  contents: read
jobs:
  readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare ESPN scheduled fixture coverage to collector filter
        run: |
          python3 - <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from collector.collector_24h import collect,base
          start=datetime(2026,11,9,10,0,tzinfo=ZoneInfo("Europe/Sarajevo"))
          end=datetime(2026,11,10,9,0,tzinfo=ZoneInfo("Europe/Sarajevo"))
          result=collect(start.astimezone(timezone.utc),end_utc=end.astimezone(timezone.utc),football_only=True)
          print("READONLY_ESPN_AUDIT",json.dumps({"start":start.isoformat(),"end":end.isoformat(),"fixtures":len(result["fixtures"]),"errors":len(result["errors"]),"leagues":list(base.FOOTBALL)}))
          for league in base.FOOTBALL:
              sources=[x for x in result["sources"] if x["league"]==league]
              events=[{"home":f["home"],"away":f["away"],"start_utc":f["start_utc"],"status":f["status"]} for f in result["fixtures"] if f["league"]==league]
              errors=[e for e in result["errors"] if e.startswith(league+"/")]
              print("ESPN_LEAGUE",json.dumps({"league":league,"sources":sources,"accepted":events,"errors":errors},ensure_ascii=False))
          import urllib.request,urllib.parse
          from datetime import datetime as dt
          for league in base.FOOTBALL:
              stats={"esboard_events":0,"parseable":0,"within_window":0,"within_window_pre":0,"within_window_other":0,"unparseable":0,"api_errors":[]}
              for day in ("20261109","20261110"):
                  url=f"{base.ROOT}/soccer/{league}/scoreboard?"+urllib.parse.urlencode({"dates":day,"limit":500})
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"MEMARA-Isolated-Collector/1.0","Accept":"application/json"}),timeout=12) as resp:
                          events=json.load(resp).get("events",[])
                      stats["esboard_events"]+=len(events)
                      for event in events:
                          try:
                              competition=event["competitions"][0]
                              kickoff=base.timestamp(event.get("date") or competition["date"])
                              stats["parseable"]+=1
                              if start.astimezone(timezone.utc)<=kickoff<end.astimezone(timezone.utc):
                                  stats["within_window"]+=1
                                  state=(event.get("status") or {}).get("type",{}).get("state")
                                  if state=="pre":stats["within_window_pre"]+=1
                                  else:stats["within_window_other"]+=1
                                  print("WINDOW_RAW_FIXTURE",json.dumps({"league":league,"date":event.get("date"),"state":state,"name":event.get("name")},ensure_ascii=False))
                          except (KeyError,TypeError,ValueError,IndexError):
                              stats["unparseable"]+=1
                  except Exception as e:
                      stats["api_errors"].append(type(e).__name__+":"+str(e)[:90])
              print("RAW_ESPN_LEAGUE",json.dumps({"league":league,**stats},ensure_ascii=False))
          for league in ("eng.1","tur.1","ita.1"):
              url=f"{base.ROOT}/soccer/{league}/scoreboard?dates=20261108&limit=500"
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"MEMARA-Isolated-Collector/1.0","Accept":"application/json"}),timeout=12) as resp:
                  old=json.load(resp)
              print("ESPN_POSITIVE_CONTROL_PREVIOUS_DAY",json.dumps({"league":league,"events":len(old.get("events",[])),"league_field":bool(old.get("leagues"))}))
          PY
