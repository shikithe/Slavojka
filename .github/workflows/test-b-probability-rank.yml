name: SAFE B highest mathematical 3plus top10 regression
on:
  push:
    branches: [fix/b-ranked-threeplus-top10-20261125]
    paths:
      - 'lista/scout_value.py'
      - 'lista/scout_six_markets.py'
      - 'lista/scout_feedback.py'
      - 'tests/test_scout_b_second_market.py'
      - 'tests/test_scout_six_markets.py'
      - '.github/workflows/test-b-probability-rank.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and regression tests
        run: |
          python -m compileall -q lista tests
          python -m unittest discover -s tests -p test_scout_b_second_market.py -v
          python -m unittest discover -s tests -p test_scout_six_markets.py -v
          python -m unittest discover -s tests -p test_scout_feedback.py -v
          python -m unittest discover -s tests -p test_top10_multicompetition.py -v
      - name: Real TOP10 dry run, no publisher or bank changes
        run: |
          python -m lista.scout_six_markets
          python -m lista.scout_feedback
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("shared/agent/scout-six-markets.json").read_text())
          t=json.loads(Path("shared/agent/top10-feedback.json").read_text())
          a=s["ticket_proposals"]["A"]
          b=s["ticket_proposals"]["B"]
          print("TOP10",t["count"],"A",a and a["combined_odds"],"B",b and b["combined_odds"])
          print("B_TOP10_RANK",json.dumps([
             {"match":r["match"],"prob3":r["probability_pct"]["3+"],
              "odd3":r["odds"]["3+"],"B":r["candidate_B"],
              "EV":r["market_value"]["3+"]["conservative_ev_pct"]}
             for r in s["ranked_fixtures"] if r["fixture_id"] in set(t["fixture_ids"])],
             ensure_ascii=False))
          assert t["count"]==10
          assert b is not None and len(b["matches"])==2
          assert b["selection_method"].startswith("Two highest available")
          assert all(x["pick"]=="3+" for x in b["matches"])
          assert 2<=b["combined_odds"]<=3
          assert not {x["fixture_id"] for x in b["matches"]}&set(x["fixture_id"] for x in a["matches"])
          assert b["ready_for_publication"] is False
          print("B_TOP10_RANKED_NO_AUTO_PUBLICATION")
          PY
      - name: No publication writes
        run: test "$GITHUB_REF_NAME" = "fix/b-ranked-threeplus-top10-20261125"
