name: ListaSix SAFE TipsterArea second-pass regression (branch only)
on:
  push:
    branches: [test/tipster-secondary-odds-recovery-20261124]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tipster-secondary-sandbox-test-only
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local parser dependencies for offline mock tests
        run: python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Validate Python source and real workflow wiring without writing data
        run: |
          python -m compileall -q kvoter lista
          python -m unittest discover -s tests -p 'test_tipster_collector.py' -v
          python -m unittest discover -s tests -p 'test_odds_feedback.py' -v
          python -m unittest discover -s tests -p 'test_tipster_feedback_cycle.py' -v
          python -m unittest discover -s tests -p 'test_scout_history_fallback.py' -v
          python - <<'PY'
          from pathlib import Path
          s=Path(".github/workflows/tipster-html-collector.yml").read_text()
          assert "kvoter.tipster_collector --secondary --force" in s
          assert s.index("kvoter.tipster_collector --secondary --force") < s.index("lista.tipster_feedback_cycle")
          assert s.index("lista.tipster_feedback_cycle") < s.index("gh workflow run listasix-scout-history.yml")
          assert "sensor_action_required" in s
          assert "shared/kvoter/ai-verified-*.json" in s
          print("SAFE_SENSOR_SECOND_PASS_CHAIN_VERIFIED")
          PY
      - name: Confirm no GitHub write permissions
        run: |
          test "$GITHUB_REF_NAME" = 'test/tipster-secondary-odds-recovery-20261124'
          echo "SAFE_NO_MAIN_WRITE_AND_NO_ODDS_PUBLICATION"
