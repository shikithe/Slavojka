name: ListaSix 00 - morning reset before ESPN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lista/daily_reset.py'
      - 'tests/test_daily_reset.py'
      - '.github/workflows/listasix-daily-reset.yml'
  schedule:
    # Four chances between 08:00 and 08:45 Sarajevo, both CET and CEST.
    # GitHub cron is best effort; local time gate is authoritative.
    - cron: '0,15,30,45 6,7 * * *'
permissions:
  contents: write
concurrency:
  group: listasix-morning-reset
  cancel-in-progress: false
jobs:
  clear-old-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify morning cleanup tests
        run: python3 -m unittest discover -s tests -p 'test_daily_reset.py' -v
      - name: Before 09:00 Sarajevo only, erase yesterday's LIVE lists
        id: gate
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          local=datetime.now(ZoneInfo("Europe/Sarajevo"))
          ok=time(8,0)<=local.time().replace(tzinfo=None)<time(9,0)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("ready="+str(ok).lower()+"\n")
          print("RESET_LOCAL_TIME_GATE",local.isoformat(),"allowed=",ok)
          PY
      - name: Reset live football offer and emit DAILY_RESET_COMPLETE
        if: steps.gate.outputs.ready == 'true'
        run: python3 -m lista.daily_reset
      - name: Commit cleared daily offer and feedback first
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- shared/collector-feed.json shared/collector-raw.json shared/active-list.json docs/collector-feed.json docs/active-list.json shared/agent/history-h2h.json shared/agent/scout-six-markets.json docs/scout-six-markets.json shared/agent/scout-feedback.json shared/agent/top10-feedback.json shared/agent/daily-reset-feedback.json shared/kvoter/coverage-feedback.json shared/kvoter/tipster-status.json shared/kvoter-ponuda.txt docs/kvoter-ponuda.txt docs/scout-six-markets.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ListaSix: first daily step, clear yesterday offer [skip ci]'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
