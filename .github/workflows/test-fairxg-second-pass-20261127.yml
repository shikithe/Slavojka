name: SAFE FairXG second-pass alias and READY gate test
on:
  push:
    branches: [fix/fairxg-identity-second-pass-before-top10-20261127]
    paths:
      - 'lista/scout_six_markets.py'
      - 'tests/test_scout_six_markets.py'
      - '.github/workflows/listasix-scout-six-markets.yml'
      - '.github/workflows/test-fairxg-second-pass-20261127.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python source validation and all original plus six-alias tests
        run: |
          python3 -m compileall -q lista tests
          python3 -m unittest discover -s tests -p test_scout_six_markets.py -v
      - name: Real FairXG read-only dry run; never publish or signal
        run: |
          python3 -m lista.scout_six_markets
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("shared/agent/scout-six-markets.json").read_text())
          t=json.loads(Path("shared/agent/top10-feedback.json").read_text())
          q=s["identity_checks"]
          assert q["status"]=="SECOND_PASS_COMPLETE" and q["validation_complete"] is True
          assert q["first_pass_checked"]==s["coverage"]["espn_total"]
          assert q["first_pass_matched"]+q["second_pass_matched"]==s["coverage"]["matched"]
          assert q["unmatched_after_second_pass"]==s["coverage"]["unmatched"]
          assert t["identity_checks"]==q
          assert s["date"]==t["date"]=="2026-11-27"
          print("REAL_FAIRXG_SECOND_PASS",
                json.dumps({"coverage":s["coverage"],"audit":q,
                            "top10":t["count"],"signal":t["feedback"],
                            "matches":[{"match":r["match"],"pass":r["matching_pass"]}
                                       for r in s["ranked_fixtures"]]},
                           ensure_ascii=False))
          print("READ_ONLY_NO_SIGNAL_NO_PUBLISH")
          PY
