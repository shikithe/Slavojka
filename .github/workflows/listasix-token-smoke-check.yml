name: ListaSix to MemaraSix token smoke check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listasix-token-smoke-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send-one-safe-event:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send one idempotent same-day repository dispatch to MemaraSix
        env:
          MEMARASIX_DISPATCH_TOKEN: ${{ secrets.MEMARASIX_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from lista.notify_memarasix import verify_source, dispatch
          token=os.environ.get("MEMARASIX_DISPATCH_TOKEN", "")
          if not token:
              raise SystemExit("TOKEN_NOT_CONFIGURED")
          signal=verify_source(Path("."), datetime.now(timezone.utc))
          dispatch(signal, token)
          print("LISTASIX_CROSS_REPO_DISPATCH_HTTP_ACCEPTED", json.dumps(signal))
          PY
