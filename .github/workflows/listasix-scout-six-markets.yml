name: ListaSix FairXG daily probabilities and TOP10
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lista/scout_six_markets.py'
      - 'tests/test_scout_six_markets.py'
      - 'shared/agent/verified-aliases.json'
      - '.github/workflows/listasix-scout-six-markets.yml'
  schedule:
    - cron: '0,15,30,45 7-12 * * *'
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: listasix-scout-six-markets
  cancel-in-progress: false
jobs:
  rank-all-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: FairXG parsing and source-identity regression tests
        run: python3 -m unittest discover -s tests -p 'test_scout_six_markets.py' -v
      - name: Require only today's ESPN and confirmed TipsterArea offer
        id: coverage
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from lista.odds_feedback import evaluate
          today=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          def read(p):
              try: return json.loads(Path(p).read_text(encoding="utf-8"))
              except (ValueError,OSError): return {}
          feed=read("shared/collector-feed.json")
          active=read("shared/active-list.json")
          fb=read("shared/kvoter/coverage-feedback.json")
          ready=False
          if feed.get("date")==active.get("date")==fb.get("date")==today and feed.get("football_candidates"):
              computed=evaluate(feed,active,today)
              ready=(computed["with_at_least_one_quote"]>0
                     and fb.get("feedback")=="ODDS_READY"
                     and fb.get("final") is True
                     and fb.get("status")=="ready_for_scout"
                     and fb.get("matched_with_quotes")==computed["with_at_least_one_quote"]
                     and fb.get("skipped_unmatched")==computed["without_quote"]
                     and fb.get("espn_total")==computed["espn_total"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("ready="+str(ready).lower()+"\n")
          print("FAIRXG_INPUTS_READY",ready)
          PY
      - name: Import published FairXG percentages and rank TOP10
        if: steps.coverage.outputs.ready == 'true'
        run: python3 -m lista.scout_six_markets

      - name: Verify second FairXG name-matching pass before any READY signal
        if: steps.coverage.outputs.ready == 'true'
        id: identity
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from lista.scout_six_markets import canonical_hash
          root=Path("shared/agent")
          report=json.loads((root/"scout-six-markets.json").read_text())
          top=json.loads((root/"top10-feedback.json").read_text())
          feed=json.loads(Path("shared/collector-feed.json").read_text())
          active=json.loads(Path("shared/active-list.json").read_text())
          audit=report.get("identity_checks",{})
          today=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          n=len(feed.get("football_candidates",[]))
          rows=report.get("ranked_fixtures",[])
          pending=report.get("unmatched",[])
          assert today==feed["date"]==active["date"]==report["date"]==top["date"]
          assert report["source_feed_sha256"]==canonical_hash(feed)
          assert report["source_active_sha256"]==canonical_hash(active)
          assert report["source_fingerprint"]==top["source_fingerprint"]
          assert audit.get("status")=="SECOND_PASS_COMPLETE" and audit.get("validation_complete") is True
          assert 0<=audit.get("third_pass_matched",0)<=audit.get("third_pass_attempted",0)<=n
          assert audit["first_pass_checked"]==n
          assert (audit["first_pass_matched"]+audit["second_pass_matched"]
                  +audit.get("third_pass_matched",0)+audit.get("registry_matched",0))==len(rows)
          assert 0<=audit["second_pass_matched"]<=audit["second_pass_attempted"]<=n
          assert audit.get("unmatched_after_registry",audit["unmatched_after_second_pass"])==len(pending)
          assert n==len(rows)+len(pending)==report["coverage"]["espn_total"]
          assert 0<=top["count"]<=10 and len(top["candidates"])==top["count"]
          assert top["fixture_ids"]==[x["fixture_id"] for x in top["candidates"]]
          assert len({x["fixture_id"] for x in rows})==len(rows)
          assert len({x["source_url"] for x in rows})==len(rows)
          assert all(x["source_url"].startswith("https://fairxg.com/sport/football/match/")
                     and x["matching_pass"] in ("primary_exact","secondary_verified_alias","third_provider_discovery","verified_registry")
                     for x in rows)
          assert top["identity_checks"]==audit
          if top["count"]:
              assert top["feedback"]=="TOP10_READY" and top["status"]=="ready"
          else:
              assert top["feedback"]=="TOP10_UNAVAILABLE"
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("verified=true\n")
          print("FAIRXG_SECOND_PASS_VERIFIED",json.dumps({
              "total":n,"primary":audit["first_pass_matched"],
              "secondary":audit["second_pass_matched"],
              "third":audit.get("third_pass_matched",0),
              "registry":audit.get("registry_matched",0),
              "remaining":len(pending),"top":top["count"]
          }))
          PY
      - name: Commit FairXG daily list and TOP10 (not AI approved)
        if: steps.identity.outputs.verified == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- shared/agent/fairxg-scout-*.json shared/agent/fairxg-top10-*.json shared/agent/scout-six-markets.json shared/agent/scout-feedback.json shared/agent/top10-feedback.json shared/agent/unmatched-feedback.json docs/scout-six-markets.json docs/scout-six-markets.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ListaSix FairXG daily probabilities and TOP10, not auto-approved [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "FAIRXG_REPORT_PUBLISHED"
                break
              fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          else
            echo "FAIRXG_NO_NEW_DATA"
          fi

      - name: Emit dedicated alias research feedback for unresolved fixtures
        if: steps.identity.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path("shared/agent/unmatched-feedback.json")
          report=json.loads(p.read_text(encoding="utf-8"))
          if report["feedback"]!="ALIASES_RESEARCH_REQUIRED" or not report["count"]:
              print("NO_ALIAS_RESEARCH_NEEDED")
              raise SystemExit(0)
          title="LISTASIX ALIAS_RESEARCH_REQUIRED — "+report["date"]+" — "+report["source_fingerprint"][:12]
          response=subprocess.run(["gh","issue","list","--repo",os.environ["GH_REPO"],"--state","all","--search",title,"--json","title,number"],check=True,capture_output=True,text=True)
          if any(x["title"]==title for x in json.loads(response.stdout)):
              print("ALIAS_RESEARCH_ALREADY_SIGNALLED")
              raise SystemExit(0)
          rows="\\n".join(f"- {r['match']} ({r['league']}; {r['fixture_id']}; {r['reason']})" for r in report["unmatched"])
          body=("UNMATCHED_ALIAS_FEEDBACK. AI researcher: investigate these fixtures on FairXG and independent club or reputable football sources. "
                "For EACH accepted alias, record ESPN home/away, FairXG home/away, league, exact FairXG match URL, and evidence URLs in "
                "shared/agent/verified-aliases.json. Verify date, competition and home/away. Never assume a match exists. "
                "An unverifiable fixture stays unmatched. Commit verified records to main; that push re-runs the scout. "
                "Do not touch betting selections or data.json.\\n\\n"+rows)
          subprocess.run(["gh","issue","create","--repo",os.environ["GH_REPO"],"--title",title,"--body",body],check=True)
          print("ALIAS_RESEARCH_FEEDBACK_CREATED",report["count"])
          PY

      - name: Emit deduplicated TOP10_READY feedback to independent AI analyst
        if: steps.identity.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report=json.loads(Path("shared/agent/top10-feedback.json").read_text(encoding="utf-8"))
          if report.get("feedback") != "TOP10_READY" or report.get("identity_checks",{}).get("status")!="SECOND_PASS_COMPLETE":
              print("NO_ELIGIBLE_TOP10_AI_NOT_TRIGGERED")
              raise SystemExit(0)
          title="LISTASIX TOP10_READY — "+report["date"]+" — "+report["source_fingerprint"][:12]
          existing=subprocess.run(["gh","issue","list","--repo",os.environ["GH_REPO"],
                                  "--state","all","--search",title,"--json","title,number"],
                                  capture_output=True,text=True,check=True)
          if any(x["title"]==title for x in json.loads(existing.stdout)):
              print("TOP10_READY_ALREADY_SIGNALLED")
              raise SystemExit(0)
          body=("TOP10_READY: FairXG published probability list is ready; unmatched ESPN fixtures are explicitly excluded.\\n"
                "Existing ChatGPT MEMARA A/B AI Scout automation: pick up this signal at the next run, "
                "research each FairXG candidate using the seven detailed factors; do not use the removed local model.\\n"
                "Read shared/agent/top10-feedback.json and the FairXG dated report.\\n"
                "Only independently verified, non-overlapping, approved A/B selections may be committed "
                "to shikithe/Memara-tip/memarasix-football-ai-approved.json. GitHub is publisher only.\\n"
                f"Fingerprint: {report['source_fingerprint']}\\n"
                f"Candidate IDs: {', '.join(report['fixture_ids'])}.\\n"
                "This issue is an AI handoff signal, NOT proof the AI analysis has run.")
          subprocess.run(["gh","issue","create","--repo",os.environ["GH_REPO"],
                          "--title",title,"--body",body],check=True)
          print("TOP10_READY_AI_HANDOFF_CREATED")
          PY

      - name: Emit TOP10_READY draft PR and ready_for_review webhook
        if: steps.identity.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          def run(*args):
              return subprocess.run(args, check=True, text=True, stdout=subprocess.PIPE).stdout.strip()
          report=json.loads(Path("shared/agent/top10-feedback.json").read_text(encoding="utf-8"))
          today=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          if report.get("feedback")!="TOP10_READY" or report.get("status")!="ready" or report.get("date")!=today or report.get("identity_checks",{}).get("status")!="SECOND_PASS_COMPLETE":
              print("TOP10_PR_NO_CURRENT_READY_FEEDBACK")
              raise SystemExit(0)
          fp=report["source_fingerprint"]
          ids=report["fixture_ids"]
          if not re.fullmatch(r"[0-9a-f]{64}",fp) or not 1<=len(ids)<=10 or len(set(ids))!=len(ids) or report["count"]!=len(ids) or report.get("publication_allowed") is not False:
              raise ValueError("Invalid TOP10 feedback")
          repo=os.environ["GH_REPO"]
          branch=f"feedback/top10-{today}-{fp[:16]}"
          feedback_id=f"TOP10-{today}-{fp}"
          title=f"LISTASIX TOP10_READY — {today} — {fp[:12]}"
          # Recover an interrupted draft; a previously sent PR is never re-emitted.
          existing=json.loads(run("gh","pr","list","--repo",repo,"--state","all","--head",branch,"--json","number,isDraft,state,url"))
          if len(existing)>1:
              raise ValueError("Ambiguous TOP10 handoff PR")
          if existing:
              pr=existing[0]
              if pr["state"]!="OPEN" or not pr["isDraft"]:
                  print("TOP10_PR_ALREADY_SIGNALLED",pr["url"])
                  raise SystemExit(0)
              number=str(pr["number"])
          else:
              # Snapshot the already committed main reports; signal branch only, never merge.
              run("git","fetch","origin","main")
              snapshot=run("git","rev-parse","origin/main")
              main_report=json.loads(run("git","show",snapshot+":shared/agent/top10-feedback.json"))
              if main_report!=report:
                  raise ValueError("TOP10 feedback changed on main; refuse stale signal")
              marker={"date":today,"feedback":"TOP10_READY","feedback_id":feedback_id,
                      "identity_matching":"SECOND_PASS_COMPLETE",
                      "source_fingerprint":fp,"fixture_ids":ids,"count":len(ids),
                      "source_commit":snapshot,"model":"FairXG","test":False,"publication_allowed":False,
                      "report":"shared/agent/top10-feedback.json","scout_report":"shared/agent/scout-six-markets.json"}
              remote=run("git","ls-remote","--heads","origin",branch)
              if not remote:
                  run("git","checkout","-b",branch,snapshot)
                  p=Path("shared/agent/handoff")/(feedback_id+".json")
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(json.dumps(marker,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
                  run("git","add","-f",str(p))
                  run("git","commit","-m","TOP10_READY handoff "+today+" [skip ci]")
                  run("git","push","origin","HEAD:refs/heads/"+branch)
              else:
                  run("git","fetch","origin",branch)
                  old=json.loads(run("git","show","FETCH_HEAD:shared/agent/handoff/"+feedback_id+".json"))
                  if old.get("source_fingerprint")!=fp or old.get("fixture_ids")!=ids or old.get("date")!=today:
                      raise ValueError("Existing handoff branch mismatch")
              body=(f"Production TOP10_READY feedback.\n\nFeedback ID: `{feedback_id}`\n"
                    f"Datum feedbacka: `{today}`\nFingerprint: `{fp}`\n"
                    f"Source commit: `{snapshot}`\n"
                    "Read the pinned TOP10 and Scout reports. This is a signal only, not approval or publication. Do not merge.")
              url=run("gh","pr","create","--repo",repo,"--base","main","--head",branch,"--draft","--title",title,"--body",body)
              number=url.rsplit("/",1)[-1]
          # Label before ready_for_review: the receiver can verify the label on that event.
          run("gh","pr","edit",number,"--repo",repo,"--add-label","TOP10_READY")
          run("gh","pr","ready",number,"--repo",repo)
          print("TOP10_PR_READY_FOR_REVIEW",number,feedback_id)
          PY
