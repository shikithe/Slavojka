name: ListaSix SCOUT 6/6 every game six markets and candidate A/B
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lista/scout_six_markets.py'
      - 'lista/scout_value.py'
      - 'tests/test_scout_six_markets.py'
      - '.github/workflows/listasix-scout-six-markets.yml'
  schedule:
    # UTC: every 15m across the European morning/early afternoon.
    # Local-date, source-date, and kickoff checks are enforced in Python.
    - cron: '0,15,30,45 7-12 * * *'
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: listasix-scout-six-markets
  cancel-in-progress: false
jobs:
  rank-all-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require today's quote feedback before independent Scout
        id: coverage
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from lista.odds_feedback import evaluate
          today=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          feedback_path=Path("shared/kvoter/coverage-feedback.json")
          if not feedback_path.exists():
              print("SCOUT_WAIT_ODDS_FEEDBACK_MISSING")
              ready=False
          else:
              status=json.loads(feedback_path.read_text(encoding="utf-8"))
              feed=json.loads(Path("shared/collector-feed.json").read_text(encoding="utf-8"))
              active=json.loads(Path("shared/active-list.json").read_text(encoding="utf-8"))
              computed=evaluate(feed, active, today)
              history_path=Path("shared/agent/history-h2h.json")
              marker_path=Path("shared/agent/history-feedback.json")
              history=json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else {}
              marker=json.loads(marker_path.read_text(encoding="utf-8")) if marker_path.exists() else {}
              ids=[x.get("fixture_id") for x in feed.get("football_candidates",[])]
              history_ready=(history.get("date")==today
                    and history.get("schema_version",0)>=3
                    and marker.get("date")==today
                    and marker.get("feedback")=="HISTORY_READY"
                    and marker.get("espn_generated_at_utc")==feed.get("generated_at_utc")
                    and marker.get("history_generated_at_utc")==history.get("generated_at_utc")
                    and marker.get("fixture_ids")==ids
                    and set(ids)=={x.get("fixture_id") for x in history.get("fixtures",[])}
                    and bool(history.get("leagues")))
              ready=(history_ready
                     and computed["with_at_least_one_quote"]>0
                     and status.get("date")==today
                     and status.get("feedback")=="ODDS_READY"
                     and status.get("final") is True
                     and status.get("status")=="ready_for_scout"
                     and status.get("matched_with_quotes")==computed["with_at_least_one_quote"]
                     and status.get("skipped_unmatched")==computed["without_quote"]
                     and status.get("espn_total")==computed["espn_total"])
              print("SCOUT_COVERAGE_AND_HISTORY_READY",ready)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("ready="+("true" if ready else "false")+"\n")
          PY
      - name: Check fresh ESPN/odds; stale history is downgraded
        if: steps.coverage.outputs.ready == 'true'
        id: sources
        run: python3 -m lista.scout_source_gate
      - name: Regression tests 100 matches times 6 markets, unique A/B, odds 2-3
        if: steps.coverage.outputs.ready == 'true' && steps.sources.outputs.ready == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_scout_six_markets.py' -v
          python3 -m unittest discover -s tests -p 'test_scout_history_fallback.py' -v
      - name: Evaluate ALL same-day ESPN fixtures on 6 markets
        if: steps.coverage.outputs.ready == 'true' && steps.sources.outputs.ready == 'true'
        run: python3 -m lista.scout_six_markets
      - name: Feedback 1 complete Scout 6/6; Feedback 2 verify TOP10 readiness
        if: steps.coverage.outputs.ready == 'true' && steps.sources.outputs.ready == 'true' && steps.sources.outputs.ready == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_scout_feedback.py' -v
          python3 -m lista.scout_feedback

      - name: Commit complete ranked matrix and unapproved A/B suggestions
        if: steps.coverage.outputs.ready == 'true' && steps.sources.outputs.ready == 'true' && steps.sources.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- shared/agent/history-h2h.json shared/agent/scout-six-markets*.json shared/agent/scout-feedback.json shared/agent/top10-feedback.json docs/scout-six-markets.json docs/scout-six-markets.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ListaSix Scout 6/6 all fixtures ranked, not auto-approved [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "SCOUT_6OF6_REPORT_PUBLISHED"
                break
              fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          else
            echo "SCOUT_6OF6_NO_NEW_DATA"
          fi

      - name: Emit deduplicated TOP10_READY feedback to independent AI analyst
        if: steps.coverage.outputs.ready == 'true' && steps.sources.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report=json.loads(Path("shared/agent/top10-feedback.json").read_text(encoding="utf-8"))
          if report.get("feedback") != "TOP10_READY":
              print("NO_ELIGIBLE_TOP10_AI_NOT_TRIGGERED")
              raise SystemExit(0)
          title="LISTASIX TOP10_READY — "+report["date"]+" — "+report["source_fingerprint"][:12]
          existing=subprocess.run(["gh","issue","list","--repo",os.environ["GH_REPO"],
                                  "--state","all","--search",title,"--json","title,number"],
                                  capture_output=True,text=True,check=True)
          if any(x["title"]==title for x in json.loads(existing.stdout)):
              print("TOP10_READY_ALREADY_SIGNALLED")
              raise SystemExit(0)
          body=("TOP10_READY: mathematical Scout 6/6 is fully verified, same-day source signatures checked.\\n"
                "Existing ChatGPT MEMARA A/B AI Scout automation: pick up this signal at the next run, "
                "research each candidate using the seven detailed factors; no Poisson recalculation.\\n"
                "Read shared/agent/top10-feedback.json and shared/agent/scout-six-markets.json.\\n"
                "Only independently verified, non-overlapping, approved A/B selections may be committed "
                "to shikithe/Memara-tip/memarasix-football-ai-approved.json. GitHub is publisher only.\\n"
                f"Fingerprint: {report['source_fingerprint']}\\n"
                f"Candidate IDs: {', '.join(report['fixture_ids'])}.\\n"
                "This issue is an AI handoff signal, NOT proof the AI analysis has run.")
          subprocess.run(["gh","issue","create","--repo",os.environ["GH_REPO"],
                          "--title",title,"--body",body],check=True)
          print("TOP10_READY_AI_HANDOFF_CREATED")
          PY

      - name: Emit TOP10_READY draft PR and ready_for_review webhook
        if: steps.coverage.outputs.ready == 'true' && steps.sources.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          def run(*args):
              return subprocess.run(args, check=True, text=True, stdout=subprocess.PIPE).stdout.strip()
          report=json.loads(Path("shared/agent/top10-feedback.json").read_text(encoding="utf-8"))
          today=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          if report.get("feedback")!="TOP10_READY" or report.get("status")!="ready" or report.get("date")!=today:
              print("TOP10_PR_NO_CURRENT_READY_FEEDBACK")
              raise SystemExit(0)
          fp=report["source_fingerprint"]
          ids=report["fixture_ids"]
          if not re.fullmatch(r"[0-9a-f]{64}",fp) or not 1<=len(ids)<=10 or len(set(ids))!=len(ids) or report["count"]!=len(ids) or report.get("publication_allowed") is not False:
              raise ValueError("Invalid TOP10 feedback")
          repo=os.environ["GH_REPO"]
          branch=f"feedback/top10-{today}-{fp[:16]}"
          feedback_id=f"TOP10-{today}-{fp}"
          title=f"LISTASIX TOP10_READY — {today} — {fp[:12]}"
          # Recover an interrupted draft; a previously sent PR is never re-emitted.
          existing=json.loads(run("gh","pr","list","--repo",repo,"--state","all","--head",branch,"--json","number,isDraft,state,url"))
          if len(existing)>1:
              raise ValueError("Ambiguous TOP10 handoff PR")
          if existing:
              pr=existing[0]
              if pr["state"]!="OPEN" or not pr["isDraft"]:
                  print("TOP10_PR_ALREADY_SIGNALLED",pr["url"])
                  raise SystemExit(0)
              number=str(pr["number"])
          else:
              # Snapshot the already committed main reports; signal branch only, never merge.
              run("git","fetch","origin","main")
              snapshot=run("git","rev-parse","origin/main")
              main_report=json.loads(run("git","show",snapshot+":shared/agent/top10-feedback.json"))
              if main_report!=report:
                  raise ValueError("TOP10 feedback changed on main; refuse stale signal")
              marker={"date":today,"feedback":"TOP10_READY","feedback_id":feedback_id,
                      "source_fingerprint":fp,"fixture_ids":ids,"count":len(ids),
                      "source_commit":snapshot,"test":False,"publication_allowed":False,
                      "report":"shared/agent/top10-feedback.json","scout_report":"shared/agent/scout-six-markets.json"}
              remote=run("git","ls-remote","--heads","origin",branch)
              if not remote:
                  run("git","checkout","-b",branch,snapshot)
                  p=Path("shared/agent/handoff")/(feedback_id+".json")
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(json.dumps(marker,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
                  run("git","add","-f",str(p))
                  run("git","commit","-m","TOP10_READY handoff "+today+" [skip ci]")
                  run("git","push","origin","HEAD:refs/heads/"+branch)
              else:
                  run("git","fetch","origin",branch)
                  old=json.loads(run("git","show","FETCH_HEAD:shared/agent/handoff/"+feedback_id+".json"))
                  if old.get("source_fingerprint")!=fp or old.get("fixture_ids")!=ids or old.get("date")!=today:
                      raise ValueError("Existing handoff branch mismatch")
              body=(f"Production TOP10_READY feedback.\n\nFeedback ID: `{feedback_id}`\n"
                    f"Datum feedbacka: `{today}`\nFingerprint: `{fp}`\n"
                    f"Source commit: `{snapshot}`\n"
                    "Read the pinned TOP10 and Scout reports. This is a signal only, not approval or publication. Do not merge.")
              url=run("gh","pr","create","--repo",repo,"--base","main","--head",branch,"--draft","--title",title,"--body",body)
              number=url.rsplit("/",1)[-1]
          # Label before ready_for_review: the receiver can verify the label on that event.
          run("gh","pr","edit",number,"--repo",repo,"--add-label","TOP10_READY")
          run("gh","pr","ready",number,"--repo",repo)
          print("TOP10_PR_READY_FOR_REVIEW",number,feedback_id)
          PY
